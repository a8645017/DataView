<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataView</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
</head>
<body>

  <header>
    <h1>DataView</h1>
  </header>

  <section class="controls">

    <div class="top-controls">
      <div class="control-group">
        <label>選擇 Excel</label>
        <input type="file" id="excelFile" accept=".xlsx,.xls">
      </div>

      <div class="control-group">
        <label>選擇圖片資料夾</label>
        <input type="file" id="imageFolder" webkitdirectory multiple>
      </div>

      <div class="control-group">
        <label>搜尋</label>
        <input type="text" id="searchInput" placeholder="輸入關鍵字">
      </div>

      <div class="control-group">
        <label>地圖顏色依據</label>
        <select id="colorBySelect">
          <option value="result">Result</option>
          <option value="crop">Crop</option>
        </select>
      </div>
    </div>

    <div class="filter-controls">

      <div class="control-group dropdown-filter">
        <label>Prefix</label>
        <button type="button" class="dropdown-button" data-target="prefixFilter">選擇 Prefix</button>
        <div id="prefixFilter" class="checkbox-group dropdown-menu"></div>
      </div>

      <div class="control-group dropdown-filter">
        <label>Crop</label>
        <button type="button" class="dropdown-button" data-target="cropFilter">選擇 Crop</button>
        <div id="cropFilter" class="checkbox-group dropdown-menu"></div>
      </div>

      <div class="control-group dropdown-filter">
        <label>Result</label>
        <button type="button" class="dropdown-button" data-target="resultFilter">選擇 Result</button>
        <div id="resultFilter" class="checkbox-group dropdown-menu"></div>
      </div>

      <div class="control-group dropdown-filter">
        <label>Location</label>
        <button type="button" class="dropdown-button" data-target="locationFilter">選擇 Location</button>
        <div id="locationFilter" class="checkbox-group dropdown-menu"></div>
      </div>
    </div>

  </section>

  <main>

    <section class="table-section">

      <table id="dataTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Crop</th>
            <th>Location</th>
            <th>Date</th>
            <th>Result</th>
            <th>Latitude</th>
            <th>Longitude</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </section>

    <section class="map-section">
      <h2>Map</h2>
      <div id="map"></div>
    </section>

    <section class="detail-section">

      <h2>Data Detail</h2>

      <div id="detailInfo"></div>

      <img id="dataImage">

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
